{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.name }}
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.auth.name }}
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.auth.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.auth.name }}
    spec:
      containers:
        - name: {{ .Values.auth.name }}
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.auth.service.port }}
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_USER
              value: {{ .Values.auth.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: auth-password
            - name: DB_NAME
              value: {{ .Values.auth.db.name | quote }}
            - name: DB_PORT
              value: {{ .Values.auth.db.port | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: secret-key
{{- end }}
