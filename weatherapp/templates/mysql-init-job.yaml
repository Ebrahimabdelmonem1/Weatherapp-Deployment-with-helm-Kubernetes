{{- if and .Values.mysql.enabled .Values.mysql.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-job
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
  annotations:
    # Run once after mysql is (re)deployed rather than as an ordinary
    # resource, since it needs the StatefulSet's pod to be reachable.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: mysql-init-container
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: auth-password
            - name: MYSQL_USER
              value: {{ .Values.auth.db.user | quote }}
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mysqladmin ping -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent; do
                echo "waiting for mysql at ${MYSQL_HOST}:${MYSQL_PORT}..."
                sleep 3
              done
              mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -uroot -p${MYSQL_ROOT_PASSWORD} <<EOF
              CREATE DATABASE IF NOT EXISTS {{ .Values.auth.db.name }};
              CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_AUTH_PASSWORD}';
              GRANT ALL PRIVILEGES ON {{ .Values.auth.db.name }}.* TO '${MYSQL_USER}'@'%';
              FLUSH PRIVILEGES;
              EOF
      restartPolicy: Never
  backoffLimit: 3
{{- end }}
