apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.ui.name }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ui.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.ui.name }}
    spec:
      containers:
        - name: {{ .Values.ui.name }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: AUTH_HOST
              value: {{ .Values.auth.name | quote }}
            - name: AUTH_PORT
              value: {{ .Values.auth.service.port | quote }}
            - name: WEATHER_HOST
              value: {{ .Values.weather.name | quote }}
            - name: WEATHER_PORT
              value: {{ .Values.weather.service.port | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
