{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ .Values.mysql.auth.rootPassword | b64enc | quote }}
  auth-password: {{ .Values.mysql.auth.authPassword | b64enc | quote }}
  secret-key: {{ .Values.mysql.auth.secretKey | b64enc | quote }}
{{- end }}
