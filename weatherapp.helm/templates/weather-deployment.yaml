apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.weather.name }}
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.weather.name }}
spec:
  replicas: {{ .Values.weather.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.weather.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.weather.name }}
    spec:
      containers:
        - name: {{ .Values.weather.name }}
          image: "{{ .Values.weather.image.repository }}:{{ .Values.weather.image.tag }}"
          imagePullPolicy: {{ .Values.weather.image.pullPolicy }}
          env:
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: weather
                  key: apikey
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
